[project]
name = "esco-occupations-indexing"
version = "0.1.0"
description = "Reproducible ESCO occupation concept indexing pipeline for Qdrant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "matplotlib>=3.11.2",
  "numpy>=2.2,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "qdrant-client[fastembed]>=1.18,<1.20",
  "typer>=0.16,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
local-embedding = [
  "sentence-transformers>=6.0,<7",
]

[project.scripts]
esco-occupation-index = "esco_occupation_indexer.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esco_occupation_indexer"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires a running Qdrant instance",
  "model: downloads and runs embedding models",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
